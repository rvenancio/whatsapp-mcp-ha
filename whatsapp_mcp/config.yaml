name: WhatsApp MCP
version: "0.3.2"
slug: whatsapp_mcp
description: Your personal WhatsApp account, linked as a device like WhatsApp Web, as an MCP server over streamable HTTP with bearer tokens (read-only by default).
url: https://github.com/jpch/whatsapp-mcp-ha
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Pairing page (QR code, status, generated token): Home Assistant ingress only, administrators only.
ingress: true
ingress_port: 8121
panel_icon: mdi:whatsapp
panel_title: WhatsApp MCP
panel_admin: true
# Restarts the add-on if the MCP endpoint stops answering.
watchdog: http://[HOST]:[PORT:8120]/healthz
# The MCP endpoint is reachable from other add-ons (e.g. cloudflared) by the add-on hostname.
# It is not published on the host unless you set a host port in the Network section.
ports:
  8120/tcp: null
ports_description:
  8120/tcp: MCP endpoint (/mcp; authentication depends on auth_method)
# /share/whatsapp-mcp/outbox: the only folder send_file can read. /share/whatsapp-mcp/downloads: download_media.
map:
  - type: share
    read_only: false
options:
  auth_method: api_key
  enable_send: false
  send_rate_per_minute: 6
  send_daily_limit: 50
  allowed_recipients: []
  allow_media_download: false
  max_media_mb: 16
  retention_days: 0
  log_level: info
schema:
  auth_method: list(none|api_key)
  auth_token: password?
  send_token: password?
  enable_send: bool
  send_rate_per_minute: int(1,60)
  send_daily_limit: int(1,10000)
  allowed_recipients:
    - str
  allow_media_download: bool
  max_media_mb: int(1,100)
  retention_days: int(0,3650)
  log_level: list(debug|info|warning|error)
